[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detech"
version = "0.1.0"
description = "Herramienta de análisis estático de código Python para detección de anomalías."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "DETECH Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
    "pygments>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
]

[project.scripts]
detech-server = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]
